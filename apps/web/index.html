<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>ACCUSE</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0b0b0d; color: #f2efe6; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      #boot-error { display: none; padding: 24px; white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error"></div>
    <script>
      window.addEventListener("error", function (e) {
        var el = document.getElementById("boot-error");
        if (!el) return;
        el.style.display = "block";
        el.textContent = "Boot error: " + (e.message || String(e.error || e));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var el = document.getElementById("boot-error");
        if (!el) return;
        el.style.display = "block";
        el.textContent = "Boot rejection: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
