<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>ACCUSE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0b0b0d; color: #f2efe6; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; z-index: 1; pointer-events: none;
      }
      #boot h1 { margin: 0; letter-spacing: 0.08em; font-size: 28px; }
      #boot h1 span { color: #e6293e; }
      #boot p { margin: 0; color: #b9b6ac; font-size: 14px; }
      #boot-error { display: none; padding: 24px; white-space: pre-wrap; word-break: break-word; color: #e6293e; position: relative; z-index: 2; }
      #root:not(:empty) ~ #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <h1>AC<span>CUSE</span></h1>
      <p>Loading…</p>
    </div>
    <div id="boot-error"></div>
    <script>
      window.addEventListener("error", function (e) {
        var el = document.getElementById("boot-error");
        var boot = document.getElementById("boot");
        if (boot) boot.style.display = "none";
        if (!el) return;
        el.style.display = "block";
        el.textContent = "Boot error: " + (e.message || String(e.error || e));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var el = document.getElementById("boot-error");
        var boot = document.getElementById("boot");
        if (boot) boot.style.display = "none";
        if (!el) return;
        el.style.display = "block";
        el.textContent = "Boot rejection: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
